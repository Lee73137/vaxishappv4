org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m
android.useAndroidX=true
org.gradle.parallel=false
# The project lives on G:\ while the pub-cache and Gradle/Kotlin caches live
# on C:\ — Kotlin's incremental compiler stores relative paths between them
# and periodically corrupts its own cache with a "different roots" error
# (recurred repeatedly across this whole session). Disabling incremental
# compilation avoids that mechanism entirely; rebuilds are a bit slower but
# reliable instead of randomly failing.
kotlin.incremental=false
